name: Track Upstream and Release

on:
  schedule:
    - cron: '43 */12 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Official QEMU version or tag to build, defaults to latest stable release
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: upstream-release
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      release_exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Resolve upstream QEMU release
        id: resolve
        uses: actions/github-script@v8
        env:
          TAG_INPUT: ${{ inputs.tag }}
        with:
          script: |
            const input = (process.env.TAG_INPUT || '').trim();
            let version;
            if (input) {
              const match = /^v?(\d+\.\d+\.\d+)$/.exec(input);
              if (!match) throw new Error('Expected a stable QEMU version or tag, for example v11.1.2');
              version = match[1];
            } else {
              // QEMU publishes source releases here, not as GitHub Releases.
              const response = await fetch('https://download.qemu.org/', { signal: AbortSignal.timeout(30000) });
              if (!response.ok) throw new Error(`QEMU release lookup failed: HTTP ${response.status}`);
              const index = await response.text();
              const versions = [...index.matchAll(/href=["'](?:https:\/\/download\.qemu\.org\/|\/)?qemu-(\d+\.\d+\.\d+)\.tar\.xz["']/g)].map(match => match[1]);
              if (!versions.length) throw new Error('No stable QEMU source release found');
              versions.sort((a, b) => {
                const left = a.split('.').map(Number);
                const right = b.split('.').map(Number);
                return left[0] - right[0] || left[1] - right[1] || left[2] - right[2];
              });
              version = versions.at(-1);
            }
            core.setOutput('tag', `v${version}`);
            core.setOutput('version', version);
      - name: Check existing package release
        id: check
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.version }}
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.RELEASE_TAG
              });
              const expected = `pfSense-pkg-qemu-guest-agent-${process.env.RELEASE_TAG}.pkg`;
              const matches = !data.draft && !data.prerelease &&
                data.assets.some(asset => asset.name === expected && asset.state === 'uploaded');
              core.setOutput('exists', matches ? 'true' : 'false');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('exists', 'false');
            }

  build:
    needs: prepare
    if: needs.prepare.outputs.release_exists == 'false' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Check package sources
        run: |
          shellcheck build.sh scripts/build-qemu-ga-freebsd.sh files/pkg-install.in files/pkg-deinstall.in files/usr/local/etc/rc.d/qemu-guest-agent
          python3 -m py_compile scripts/prepare-pfsense-sysroot.py
          find files -type f \( -name '*.php' -o -name '*.inc' \) -print0 | xargs -0 -n1 php -l
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          for path in pathlib.Path('files').rglob('*.xml'):
              ET.parse(path)
          PY
      - name: Build qemu-ga and pfSense package
        uses: vmactions/freebsd-vm@v1.4.8
        env:
          PORTVERSION: ${{ needs.prepare.outputs.version }}
          QEMU_TAG: ${{ needs.prepare.outputs.tag }}
        with:
          release: '15.0'
          usesh: true
          mem: 4096
          envs: PORTVERSION QEMU_TAG
          prepare: |
            export ASSUME_ALWAYS_YES=yes
            pkg bootstrap -f
            pkg update -f
            pkg install -y bash ca_root_nss curl git gmake ninja meson pkgconf python3 zstd
          run: |
            set -eu
            chmod +x build.sh scripts/build-qemu-ga-freebsd.sh
            ./scripts/build-qemu-ga-freebsd.sh "$QEMU_TAG"
            test "$(cat dist/VERSION)" = "$PORTVERSION"
            ./build.sh package
            cp "build/pkg/pfSense-pkg-qemu-guest-agent-${PORTVERSION}.pkg" "./pfSense-pkg-qemu-guest-agent-${PORTVERSION}.pkg"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          make_latest: 'true'
          body: |
            QEMU Guest Agent ${{ needs.prepare.outputs.version }} for pfSense 2.8.x amd64.

            ## Install

            ```sh
            curl -fSL -o /tmp/pfSense-pkg-qemu-guest-agent-${{ needs.prepare.outputs.version }}.pkg \
              "https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.version }}/pfSense-pkg-qemu-guest-agent-${{ needs.prepare.outputs.version }}.pkg"

            /usr/local/sbin/pkg-static add -f /tmp/pfSense-pkg-qemu-guest-agent-${{ needs.prepare.outputs.version }}.pkg
            ```
          overwrite_files: true
          files: pfSense-pkg-qemu-guest-agent-${{ needs.prepare.outputs.version }}.pkg
