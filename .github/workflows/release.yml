name: Track Upstream and Release

on:
  schedule:
    - cron: '43 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-release
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      freebsd_version: ${{ steps.version.outputs.freebsd_version }}
      release_exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Fetch FreeBSD qemu-ga
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          ./scripts/fetch-freebsd-qemu-guest-agent.sh
      - name: Read the binary version on FreeBSD
        uses: vmactions/freebsd-vm@v1.4.8
        with:
          release: '15.0'
          usesh: true
          prepare: |
            export ASSUME_ALWAYS_YES=yes
            pkg bootstrap -f
            pkg install -y glib
          run: |
            set -eu
            output=$(./dist/qemu-ga --version)
            version=$(printf '%s\n' "$output" | sed -nE 's/^QEMU Guest Agent ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')
            test -n "$version"
            printf '%s\n' "$version" > dist/VERSION
      - name: Record versions
        id: version
        run: |
          printf 'version=%s\n' "$(cat dist/VERSION)" >> "$GITHUB_OUTPUT"
          printf 'freebsd_version=%s\n' "$(cat dist/FREEBSD_VERSION)" >> "$GITHUB_OUTPUT"
      - name: Check existing QEMU release
        id: check
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ steps.version.outputs.version }}
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.RELEASE_TAG
              });
              core.setOutput('exists', !data.draft && !data.prerelease ? 'true' : 'false');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('exists', 'false');
            }
      - name: Preserve the inspected binary
        if: steps.check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: upstream-qemu-ga
          path: |
            dist/qemu-ga
            dist/VERSION
            dist/FREEBSD_VERSION
          retention-days: 1

  build:
    needs: prepare
    if: needs.prepare.outputs.release_exists == 'false' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Check package sources
        run: |
          shellcheck build.sh scripts/fetch-freebsd-qemu-guest-agent.sh files/pkg-install.in files/pkg-deinstall.in files/usr/local/etc/rc.d/qemu-guest-agent
          find files -type f \( -name '*.php' -o -name '*.inc' \) -print0 | xargs -0 -n1 php -l
          php tests/updater.php
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          for path in pathlib.Path('files').rglob('*.xml'):
              ET.parse(path)
          PY
      - uses: actions/download-artifact@v8.0.2
        with:
          name: upstream-qemu-ga
          path: dist
      - name: Build package on FreeBSD 15
        uses: vmactions/freebsd-vm@v1.4.8
        env:
          PORTVERSION: ${{ needs.prepare.outputs.version }}
        with:
          release: '15.0'
          usesh: true
          envs: PORTVERSION
          prepare: |
            export ASSUME_ALWAYS_YES=yes
            pkg bootstrap -f
            pkg install -y glib
          run: |
            set -eu
            chmod +x dist/qemu-ga
            test "$(./dist/qemu-ga --version)" = "QEMU Guest Agent ${PORTVERSION}"
            ./build.sh package
            cp build/pkg/*.pkg ./pfSense-pkg-qemu-guest-agent-${PORTVERSION}.pkg
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          body: |
            QEMU Guest Agent `${{ needs.prepare.outputs.version }}` for pfSense / FreeBSD 15 amd64.
            Bundles the FreeBSD-built binary unchanged with pfSense service and WebGUI integration.
          overwrite_files: true
          files: pfSense-pkg-qemu-guest-agent-${{ needs.prepare.outputs.version }}.pkg
